name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifeos -d lifeos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      LIFEOS_DATABASE_NAME: lifeos_test
      LIFEOS_DATABASE_USER: lifeos
      LIFEOS_DATABASE_PASSWORD: lifeos
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          # Acceptance helper (infra/scripts/recette.sh), run inside the ml and stt images.
          uv run ruff check --config pyproject.toml ../infra/scripts/lib/recette.py
          uv run ruff format --config pyproject.toml --check ../infra/scripts/lib/recette.py
      - name: Type check
        run: |
          uv run mypy
          uv run mypy ../infra/scripts/lib/recette.py
      - name: Tests
        run: uv run pytest -q
      - name: Migrations match models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Dependency audit
        run: |
          uv export --no-dev --all-extras --no-hashes --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifeos -d lifeos_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Backend dependencies
        working-directory: backend
        run: uv sync --locked
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Web dependencies and browser
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Build web
        working-directory: apps/web
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: End-to-end tests, desktop and phone projects (passkeys, journeys, accessibility, keyboard, mobile)
        working-directory: apps/web
        run: pnpm e2e --project=chromium --project=mobile-chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  ml-model:
    # The real embedding model: downloaded once (cached), then used offline on a read-only
    # cache, as in production. Also prints calibration distances and throughput. And the
    # local text extraction (PDF text layer, Tesseract OCR in French, image sanitizing).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      LIFEOS_EMBEDDINGS_MODEL: google/embeddinggemma-300m
      LIFEOS_EMBEDDINGS_CACHE_DIR: ${{ github.workspace }}/models
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install (with the ml and stt extras)
        run: uv sync --locked --extra ml --extra stt
      - name: OCR engine (Tesseract with the French model) and a font with accents
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra fonts-dejavu-core
      - uses: actions/cache@v4
        with:
          path: models
          key: embeddings-google-embeddinggemma-300m-v1
      - name: Download the model
        run: uv run lifeos-ml download
      - name: Real model and extraction tests (offline, read-only cache)
        run: |
          chmod -R a-w "$LIFEOS_EMBEDDINGS_CACHE_DIR"
          HF_HUB_OFFLINE=1 LIFEOS_TEST_REAL_MODEL=1 uv run pytest -q -s tests_ml
          chmod -R u+w "$LIFEOS_EMBEDDINGS_CACHE_DIR"
      - name: Speech-to-text pipeline (tiny random model, browser formats, offline)
        run: HF_HUB_OFFLINE=1 uv run pytest -q tests_stt

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: |
          docker build --target app -t lifeos-backend:ci backend
          docker build --target ml -t lifeos-ml:ci backend
          docker build --target stt -t lifeos-stt:ci backend
          docker build -t lifeos-web:ci apps/web
      - name: The web image sends a script policy with a new nonce for every page (src/proxy.ts)
        run: |
          docker run -d --name web --read-only --tmpfs /tmp --tmpfs /app/.next/cache --cap-drop ALL \
            --memory 512m -p 127.0.0.1:3000:3000 lifeos-web:ci
          for _ in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:3000/login && break; sleep 1; done
          scripts() {
            curl -fsS -D - -o /dev/null http://127.0.0.1:3000/login | tr -d '\r' \
              | sed -n "s/^content-security-policy:.*\(script-src [^;]*\).*/\1/Ip"
          }
          first="$(scripts)"
          second="$(scripts)"
          echo "$first"
          grep -qx "script-src 'self' 'nonce-[A-Za-z0-9+/]*=*' 'strict-dynamic'" <<<"$first"
          test "$first" != "$second"
          docker rm -f web
      - name: The ml image starts without network nor model (degraded, healthy API)
        run: |
          docker run -d --name ml --network none --read-only --tmpfs /tmp lifeos-ml:ci
          sleep 8
          docker exec ml python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=2).read())"
          docker logs ml 2>&1 | tail -5
          docker rm -f ml
      - name: The ml image reads a French receipt (OCR), without network
        run: docker run --rm --network none --read-only --tmpfs /tmp lifeos-ml:ci lifeos-ml selftest
      - name: The acceptance helper measures the local OCR in the ml image (recette.sh)
        run: |
          docker run -d --name ml --network none --read-only --tmpfs /tmp lifeos-ml:ci
          for _ in $(seq 1 30); do
            docker exec ml python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=2)" \
              2>/dev/null && break
            sleep 1
          done
          docker exec ml python -c "$(cat infra/scripts/lib/recette.py)" ocr 1 | tee "$RUNNER_TEMP/ocr.jsonl"
          jq -se 'length == 2 and all(.[]; .status == 200 and .pages >= 1 and .chars > 100)' \
            "$RUNNER_TEMP/ocr.jsonl"
          docker exec ml python -c "$(cat infra/scripts/lib/recette.py)" receipt | file - | grep -q JPEG
          docker rm -f ml
      - name: The stt image starts without network nor model (loaded on first dictation)
        run: |
          docker run -d --name stt --network none --read-only --tmpfs /tmp lifeos-stt:ci
          sleep 8
          docker exec stt python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8200/healthz', timeout=2).read())"
          docker exec stt python -c "import faster_whisper, ctranslate2, av; print(faster_whisper.__version__, ctranslate2.__version__, av.__version__)"
          docker rm -f stt
      - name: Validate Compose file
        working-directory: infra
        run: |
          ./scripts/init-secrets.sh
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
          # Behind an existing reverse proxy: Traefik publishes no port at all.
          docker compose -f compose.yaml -f compose.gpu.yaml -f compose.proxy.yaml config --quiet
          test "$(docker compose -f compose.yaml -f compose.proxy.yaml config --format json \
            | jq -c '.services.traefik.ports')" = null
          # Monitoring and alerts (profile `monitoring`), in both modes.
          docker compose --profile monitoring config --quiet
          docker compose -f compose.yaml -f compose.proxy.yaml --profile monitoring config --quiet
          # The images of a deployed version carry its tag (update.sh), `local` by default.
          test "$(LIFEOS_IMAGE_TAG=0123abcd docker compose -f compose.yaml -f compose.gpu.yaml \
            config --format json | jq -r '[.services[] | select(.build) | .image] | unique | join(" ")')" \
            = "lifeos-backend:0123abcd lifeos-ml:0123abcd lifeos-stt-gpu:0123abcd lifeos-web:0123abcd"
          test "$(docker compose config --format json | jq -r '.services.api.image')" = lifeos-backend:local
      - name: Traefik routing, headers and rate limit (standard and behind a reverse proxy)
        run: scripts/test-traefik.sh
      - name: Alerts (rules, Alertmanager, simulated outages without personal data, public probes)
        run: scripts/test-monitoring.sh
      - name: Acceptance tool (times, memory peaks, HTTPS checks, report without personal data)
        run: scripts/test-recette.sh
        env:
          LIFEOS_TEST_BACKEND_IMAGE: lifeos-backend:ci
          LIFEOS_TEST_WEB_IMAGE: lifeos-web:ci
          LIFEOS_TEST_ML_IMAGE: lifeos-ml:ci
      - name: restic (official binary; Ubuntu ships an older one)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/restic.bz2" \
            https://github.com/restic/restic/releases/download/v0.18.1/restic_0.18.1_linux_amd64.bz2
          echo "680838f19d67151adba227e1570cdd8af12c19cf1735783ed1ba928bc41f363d  $RUNNER_TEMP/restic.bz2" \
            | sha256sum -c -
          bunzip2 -c "$RUNNER_TEMP/restic.bz2" > "$RUNNER_TEMP/restic"
          sudo install -m 755 "$RUNNER_TEMP/restic" /usr/local/bin/restic
          restic version
      - name: Backup and restore round trip (pairs, missing originals, blank machine, passkey sign-in, alerts)
        run: scripts/test-backup.sh
        env:
          LIFEOS_TEST_BACKEND_IMAGE: lifeos-backend:ci
      - name: Update and rollback (pre-update backup, migrations, health check, automatic rollback)
        run: scripts/test-update.sh
        env:
          LIFEOS_TEST_BACKEND_IMAGE: lifeos-backend:ci
      - name: Backup timers (systemd units)
        run: |
          units="$(mktemp -d)"
          for unit in infra/systemd/*; do sed "s|/opt/lifeos|$PWD|g" "$unit" > "$units/${unit##*/}"; done
          systemd-analyze verify "$units"/*.service "$units"/*.timer
      - name: Shellcheck
        run: shellcheck infra/scripts/*.sh infra/scripts/lib/*.sh infra/postgres/init/*.sh infra/prometheus/*.sh scripts/*.sh apps/web/e2e/*.sh
