name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifeos -d lifeos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      LIFEOS_DATABASE_NAME: lifeos_test
      LIFEOS_DATABASE_USER: lifeos
      LIFEOS_DATABASE_PASSWORD: lifeos
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q
      - name: Migrations match models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Dependency audit
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifeos -d lifeos_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Backend dependencies
        working-directory: backend
        run: uv sync --locked
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Web dependencies and browser
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Build web
        working-directory: apps/web
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: End-to-end tests (passkeys, tasks, assistant, journal, memory, search)
        working-directory: apps/web
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: |
          docker build -t lifeos-backend:ci backend
          docker build -t lifeos-web:ci apps/web
      - name: Validate Compose file
        working-directory: infra
        run: |
          ./scripts/init-secrets.sh
          cp .env.example .env
          docker compose config --quiet
      - name: Shellcheck
        run: shellcheck infra/scripts/*.sh infra/postgres/init/*.sh
