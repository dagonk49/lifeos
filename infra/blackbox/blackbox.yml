# Probes of the public URL (compose profile `monitoring`, job `public` of
# infra/prometheus/prometheus.yml). The domain resolves to the host (extra_hosts:
# host-gateway): the probe goes through port 443 of this machine, to Traefik or to the reverse
# proxy of compose.proxy.yaml, as a device of the network would.
modules:
  # Is LifeOS up? Any certificate (its expiry date is still measured).
  https_reachable:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_not_ssl: true
      follow_redirects: false
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true
  # Would a browser accept the certificate? System authorities, plus a local one (mkcert)
  # copied to infra/blackbox/ca/ (SSL_CERT_DIR).
  https_verified:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_not_ssl: true
      follow_redirects: false
      preferred_ip_protocol: ip4
