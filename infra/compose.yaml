# LifeOS — Docker Compose (ADR 0005). Usage: see docs/exploitation.md
# Memory limits are sized for a 10 GB VM (4 cores / 8 threads): see docs/exploitation.md.
name: lifeos

x-backend: &backend
  build: { context: ../backend, target: app }
  # Tag of the deployed version (infra/scripts/update.sh): images of earlier versions stay
  # on the machine, so a rollback needs no rebuild.
  image: lifeos-backend:${LIFEOS_IMAGE_TAG:-local}
  restart: unless-stopped
  env_file: .env
  environment:
    LIFEOS_DATABASE_HOST: postgres
    LIFEOS_REDIS_URL: redis://redis:6379/0
    LIFEOS_DOCUMENTS_DIR: /data/documents
  secrets:
    - lifeos_database_password
    - lifeos_gemini_api_key
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-ml: &ml
  build: { context: ../backend, target: ml }
  image: lifeos-ml:${LIFEOS_IMAGE_TAG:-local}
  env_file: .env
  environment:
    # The ml service never calls the LLM, the database nor a connected account.
    LIFEOS_LLM_PROVIDER: disabled
    LIFEOS_CONNECTORS_PROVIDER: disabled
  # A minimal init as PID 1 (ADR 0011): an OCR process killed with its extraction child is
  # orphaned, and only an init reaps it (the service, as PID 1, would keep it as a zombie).
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

x-stt: &stt
  build: { context: ../backend, target: stt }
  image: lifeos-stt:${LIFEOS_IMAGE_TAG:-local}
  env_file: .env
  environment:
    # The stt service never calls the LLM, the database nor a connected account.
    LIFEOS_LLM_PROVIDER: disabled
    LIFEOS_CONNECTORS_PROVIDER: disabled
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    # Tuned for a 10 GB VM shared with the other services (SSD storage assumed).
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=50
      - -c
      - random_page_cost=1.1
      - -c
      - max_parallel_maintenance_workers=2
    mem_limit: 2g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: lifeos
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
    secrets: [postgres_superuser_password, lifeos_database_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    # Shared memory for parallel index builds (HNSW): at least maintenance_work_mem.
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifeos"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Not a source of truth (ADR 0004): the append-only file only limits lost queued jobs.
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    mem_limit: 256m
    volumes: [redisdata:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  # migrate and scheduler read .env without the connector secrets: they never build the
  # connectors (only the api checks the key and the client, at start; ADR 0012).
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    mem_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  api:
    <<: *backend
    # Documents (F10, ADR 0008): encrypted originals on a volume, key in its own secret.
    secrets: &documents-secrets
      - lifeos_database_password
      - lifeos_gemini_api_key
      - lifeos_documents_key
      # Connected accounts (ADR 0012): key of the sealed OAuth tokens, Google client secret.
      - lifeos_connectors_key
      - lifeos_google_client_secret
      # Web Push (ADR 0019): the worker signs with it, the api publishes the public key.
      - lifeos_vapid_private_key
    volumes: &documents-volume [documents:/data/documents]
    mem_limit: 768m
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # `edge` gives Traefik access and outbound HTTPS (LLM provider).
    networks: [internal, edge]

  worker:
    <<: *backend
    # One process: it serves its metrics on :9101 (LIFEOS_WORKER_METRICS_PORT), for the
    # monitoring (internal network) and for this health check.
    command: ["dramatiq", "lifeos.workers.actors", "--processes", "1", "--threads", "4"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Extraction, sanitized images and retention of the document originals.
    secrets: *documents-secrets
    volumes: *documents-volume
    mem_limit: 768m
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # `egress`: also the push services (FCM, Apple, Mozilla) for Web Push, ADR 0019.
    networks: [internal, egress]

  scheduler:
    <<: *backend
    command: ["lifeos-scheduler"]
    healthcheck: { disable: true }
    mem_limit: 256m
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [internal]

  # Local embedding model (ADR 0006), loaded once for the api and the worker. No route
  # to the outside world: the model must have been downloaded first (`ml-download`).
  ml:
    <<: *ml
    restart: unless-stopped
    volumes: [models:/models:ro]
    networks: [internal]
    # EmbeddingGemma-300m (ONNX, fp32): about 1.2 GB on disk, 1.5-2.5 GB in RAM at peak;
    # OCR adds about 0.3 GB while a document is read (one at a time).
    mem_limit: 3g
    cpus: 4

  # One-time download of the embedding model: docker compose --profile setup run --rm ml-download
  ml-download:
    <<: *ml
    profiles: [setup]
    command: ["lifeos-ml", "download"]
    restart: "no"
    environment:
      LIFEOS_LLM_PROVIDER: disabled
      LIFEOS_CONNECTORS_PROVIDER: disabled
      HF_HUB_OFFLINE: "0"
    secrets: [lifeos_hf_token]
    volumes: [models:/models]
    networks: [egress]
    mem_limit: 3g

  # Local speech-to-text (ADR 0009): dictations only. No route to the outside world: the
  # model must have been downloaded first (`stt-download`). NVIDIA GPU: compose.gpu.yaml.
  stt:
    <<: *stt
    restart: unless-stopped
    volumes: [stt-models:/models:ro]
    networks: [internal]
    # Whisper large-v3-turbo (int8): about 1.6 GB on disk, 1.6-1.9 GB in RAM while loaded;
    # unloaded after LIFEOS_STT_IDLE_UNLOAD_S without a dictation.
    mem_limit: 2560m
    cpus: 4

  # One-time download of the speech model: docker compose --profile setup run --rm stt-download
  stt-download:
    <<: *stt
    profiles: [setup]
    command: ["lifeos-stt", "download"]
    restart: "no"
    environment:
      LIFEOS_LLM_PROVIDER: disabled
      LIFEOS_CONNECTORS_PROVIDER: disabled
      HF_HUB_OFFLINE: "0"
    volumes: [stt-models:/models]
    networks: [egress]
    mem_limit: 1g

  web:
    build: ../apps/web
    image: lifeos-web:${LIFEOS_IMAGE_TAG:-local}
    restart: unless-stopped
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
    logging: *logging

  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    # File provider only: the Docker socket is never mounted.
    command: ["--configFile=/etc/traefik/traefik.yml"]
    environment:
      LIFEOS_DOMAIN: ${LIFEOS_DOMAIN:?set LIFEOS_DOMAIN in infra/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certs:ro
    networks: [edge]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    logging: *logging

  # --- Monitoring (profile `monitoring`, infra/scripts/install-monitoring.sh) --------------
  # Metrics, alert rules (prometheus/alerts.yml) and 15 days of history.
  prometheus:
    image: prom/prometheus:v3.5.5
    profiles: [monitoring]
    restart: unless-stopped
    # Writes the public probe targets from LIFEOS_DOMAIN, then starts Prometheus.
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    environment:
      LIFEOS_DOMAIN: ${LIFEOS_DOMAIN:?set LIFEOS_DOMAIN in infra/.env}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - prometheusdata:/prometheus
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # `internal` to scrape the api and the worker; `monitoring` for the exporters.
    networks: [internal, monitoring]
    # Local access only (e.g. through an SSH tunnel).
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    mem_limit: 512m
    logging: *logging

  # Sends the alerts (ntfy, optionally e-mail or Telegram) and the dead man's switch signal.
  # Its configuration holds the channel's secrets: generated by install-monitoring.sh.
  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/run/secrets/alertmanager_config
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
      # A single instance: no cluster port.
      - --cluster.listen-address=
    secrets: [alertmanager_config]
    volumes:
      - ./alertmanager/lifeos.tmpl:/etc/alertmanager/lifeos.tmpl:ro
      - alertmanagerdata:/alertmanager
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Reaches the notification services on the Internet (no published port).
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 64m
    logging: *logging

  # The VM: disk space, memory, OOM kills, and the backup metrics (textfile collector,
  # written by infra/scripts/backup.sh and restore-check.sh). The host's root is mounted
  # read-only, for its file systems' sizes only.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.filesystem
      - --collector.loadavg
      - --collector.meminfo
      - --collector.pressure
      - --collector.textfile
      - --collector.textfile.directory=/textfile
      - --collector.time
      - --collector.vmstat
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|textfile|etc/hostname|etc/hosts|etc/resolv\.conf|var/lib/docker/.+|var/lib/containers/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
      - ${LIFEOS_METRICS_DIR:-/var/lib/lifeos/metrics}:/textfile:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    logging: *logging

  # LifeOS as the owner's devices reach it: https://<domain>/ through this machine's port
  # 443 (Traefik, or the reverse proxy of compose.proxy.yaml), certificate included.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    profiles: [monitoring]
    restart: unless-stopped
    user: "65534:65534"
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    environment:
      # System authorities, plus a local one (mkcert) put in blackbox/ca/.
      SSL_CERT_DIR: /etc/ssl/certs:/etc/lifeos-ca
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ./blackbox/ca:/etc/lifeos-ca:ro
    # The domain resolves to this machine (its port 443), whatever the DNS answers inside
    # Docker; a reverse proxy on another machine: LIFEOS_PROBE_ADDRESS=<its IP address>.
    extra_hosts:
      - "${LIFEOS_DOMAIN:?set LIFEOS_DOMAIN in infra/.env}:${LIFEOS_PROBE_ADDRESS:-host-gateway}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    logging: *logging

networks:
  # No route to the outside world: databases are unreachable except from LifeOS services.
  internal:
    internal: true
  edge: {}
  egress: {}
  monitoring: {}

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  # Silences and notification log of Alertmanager.
  alertmanagerdata:
  # Embedding model files (re-downloadable: excluded from backups).
  models:
  # Speech model files (re-downloadable: excluded from backups).
  stt-models:
  # Encrypted document originals (AES-256-GCM, key in the lifeos_documents_key secret).
  documents:

secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password
  lifeos_database_password:
    file: ./secrets/lifeos_database_password
  lifeos_gemini_api_key:
    file: ./secrets/lifeos_gemini_api_key
  # AES-256-GCM key of the document originals (infra/scripts/init-secrets.sh).
  lifeos_documents_key:
    file: ./secrets/lifeos_documents_key
  # Optional (gated models only): a Hugging Face read token, used by ml-download.
  lifeos_hf_token:
    file: ./secrets/lifeos_hf_token
  # AES-256-GCM key of the OAuth tokens of the connected accounts (ADR 0012).
  lifeos_connectors_key:
    file: ./secrets/lifeos_connectors_key
  # Secret of the Google OAuth client (empty while LIFEOS_CONNECTORS_PROVIDER is not google).
  lifeos_google_client_secret:
    file: ./secrets/lifeos_google_client_secret
  # P-256 VAPID key of Web Push, PEM (infra/scripts/init-secrets.sh, ADR 0019).
  lifeos_vapid_private_key:
    file: ./secrets/lifeos_vapid_private_key
  # Alertmanager configuration with the alert channel (install-monitoring.sh).
  alertmanager_config:
    file: ./secrets/alertmanager.yml
