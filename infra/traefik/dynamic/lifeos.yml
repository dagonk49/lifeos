# Dynamic configuration (Go templates: LIFEOS_DOMAIN comes from the Traefik environment).
http:
  routers:
    lifeos-api:
      rule: "Host(`{{ env "LIFEOS_DOMAIN" }}`) && (PathPrefix(`/v1`) || Path(`/healthz`))"
      entryPoints: [websecure]
      service: lifeos-api
      middlewares: [lifeos-headers]
    lifeos-auth:
      rule: "Host(`{{ env "LIFEOS_DOMAIN" }}`) && PathPrefix(`/v1/auth`)"
      priority: 1000
      entryPoints: [websecure]
      service: lifeos-api
      middlewares: [lifeos-auth-ratelimit, lifeos-headers]

    lifeos-web:
      rule: "Host(`{{ env "LIFEOS_DOMAIN" }}`)"
      priority: 1
      entryPoints: [websecure]
      service: lifeos-web
      middlewares: [lifeos-headers]

  middlewares:
    lifeos-auth-ratelimit:
      rateLimit:
        average: 30
        period: 1m
        burst: 15
{{- if eq (env "LIFEOS_BEHIND_PROXY") "true" }}
        # Behind a reverse proxy (compose.proxy.yaml), every request comes from the proxy: the
        # client is the last address of X-Forwarded-For, the one the proxy appended itself.
        sourceCriterion:
          ipStrategy:
            depth: 1
{{- end }}
    lifeos-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        # Routers only listen on HTTPS (or behind a TLS-terminating proxy, compose.proxy.yaml,
        # where this hop is plain HTTP): browsers only honour the header over HTTPS anyway.
        forceSTSHeader: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
        permissionsPolicy: "camera=(), geolocation=(), microphone=(self)"

  services:
    lifeos-api:
      loadBalancer:
        servers:
          - url: "http://api:8000"
        healthCheck:
          path: /healthz
          interval: 15s
    lifeos-web:
      loadBalancer:
        servers:
          - url: "http://web:3000"
