# Static configuration. Routing lives in dynamic/ (file provider, no Docker socket).
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls: {}

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: false

log:
  level: INFO

# Access logs are off: the API logs requests itself, without query strings.
global:
  checkNewVersion: false
  sendAnonymousUsage: false
